version: 2

registries:
  github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.GH_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    registries: 
      - "github-npm"
    ignore:
      - dependency-name: "@welcomer-bot/*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
